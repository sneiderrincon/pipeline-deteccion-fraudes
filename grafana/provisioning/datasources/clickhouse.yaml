apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 8123
      username: default
      defaultDatabase: default
      protocol: http
    secureJsonData:
      password: password
    version: 1
