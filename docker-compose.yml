services:

  # ─── Kafka (single-broker KRaft) ──────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: fraud-pipeline-local-001
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # ─── Topic initializer ────────────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/code/init-topic.sh:/init-topic.sh
    environment:
      KAFKA_TOPIC: fraud-transactions
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_PARTITIONS: "3"
      KAFKA_REPLICATION: "1"
    command: ["/bin/bash", "/init-topic.sh"]
    restart: "no"

  # ─── Kafka UI ─────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ─── Transaction Producer (Java) ──────────────────────────────────────────
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: fraud-transactions
      TEST_DATA_PATH: /data/fraudTest.csv
      DELAY_MIN_MS: "50"
      DELAY_MAX_MS: "300"
    volumes:
      - ./data:/data:ro

  # ─── ClickHouse ───────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: "password"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spark Master ─────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.5-java17-python3
    container_name: spark-master
    user: root
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8081:8080"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./spark/code:/opt/spark/apps
      - ./model:/opt/spark/model
      - ./spark/jars:/opt/spark/extra-jars
      - spark_data:/opt/spark/work-dir

  # ─── Spark Worker ─────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.5-java17-python3
    container_name: spark-worker
    user: root
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "3g"
      SPARK_WORKER_WEBUI_PORT: "8082"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./spark/code:/opt/spark/apps
      - ./model:/opt/spark/model
      - ./spark/jars:/opt/spark/extra-jars

  # ─── Spark Submit ─────────────────────────────────────────────────────────
  spark-submit:
    image: apache/spark:3.5.5-java17-python3
    container_name: spark-submit
    user: root
    depends_on:
      - spark-master
      - spark-worker
      - clickhouse
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: fraud-transactions
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_PASSWORD: "password"
      MODEL_PATH: /opt/spark/model/xgb_full_pipeline.pkl
      FRAUD_THRESHOLD: "0.3"
    volumes:
      - ./spark/code:/opt/spark/apps
      - ./model:/opt/spark/model
      - ./spark/jars:/opt/spark/extra-jars
      - spark_data:/opt/spark/work-dir
    command: ["/bin/bash", "/opt/spark/apps/submit.sh"]
    restart: "no"

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  kafka_data:
  clickhouse_data:
  spark_data:
  grafana_data:
